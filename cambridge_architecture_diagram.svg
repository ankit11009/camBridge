<svg viewBox="0 0 960 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="900" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">CamBridge — System Architecture</text>

  <!-- Frontend -->
  <rect x="280" y="70" width="400" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Frontend</text>
  <text x="480" y="120" text-anchor="middle" font-size="13" fill="#0c4a6e">React + TypeScript + Vite + Tailwind</text>
  <text x="480" y="138" text-anchor="middle" font-size="12" fill="#0369a1">Dashboard · Live Video Player · Event History</text>

  <!-- Arrow FE -> BE -->
  <line x1="480" y1="150" x2="480" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="178" text-anchor="middle" font-size="12" fill="#334155">REST / WebSocket (JWT)</text>

  <!-- Backend outer -->
  <rect x="120" y="200" width="720" height="200" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Backend — NestJS + TypeScript</text>

  <!-- Backend sub-modules -->
  <rect x="140" y="240" width="150" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="215" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Auth Module</text>
  <text x="215" y="282" text-anchor="middle" font-size="10" fill="#4b5563">JWT · Guards</text>

  <rect x="305" y="240" width="150" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Cameras Module</text>
  <text x="380" y="282" text-anchor="middle" font-size="10" fill="#4b5563">CRUD · Orchestration</text>

  <rect x="470" y="240" width="150" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="545" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Plugin Manager</text>
  <text x="545" y="282" text-anchor="middle" font-size="10" fill="#4b5563">Lifecycle API</text>

  <rect x="635" y="240" width="150" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="710" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">WebSocket Gateway</text>
  <text x="710" y="282" text-anchor="middle" font-size="10" fill="#4b5563">Status · Events</text>

  <rect x="305" y="315" width="150" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Streaming Module</text>
  <text x="380" y="357" text-anchor="middle" font-size="10" fill="#4b5563">FFmpeg process mgmt</text>

  <rect x="470" y="315" width="150" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="545" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Recordings Module</text>
  <text x="545" y="357" text-anchor="middle" font-size="10" fill="#4b5563">Start/stop · Storage</text>

  <!-- Arrows BE -> data layer -->
  <line x1="300" y1="400" x2="300" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="400" x2="480" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="400" x2="660" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data layer -->
  <rect x="180" y="450" width="240" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">PostgreSQL</text>
  <text x="300" y="497" text-anchor="middle" font-size="11" fill="#92400e">via Prisma ORM</text>

  <rect x="440" y="450" width="240" height="70" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="560" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Redis</text>
  <text x="560" y="490" text-anchor="middle" font-size="11" fill="#991b1b">Cache / pub-sub</text>
  <text x="560" y="505" text-anchor="middle" font-size="10" fill="#991b1b">(introduced Phase 5+)</text>

  <line x1="480" y1="520" x2="480" y2="556" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="560" width="520" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="584" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Plugin Runtime</text>
  <text x="480" y="600" text-anchor="middle" font-size="11" fill="#166534">implements the CameraPlugin interface — core backend never imports these directly</text>

  <rect x="245" y="612" width="140" height="30" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="315" y="632" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Mock Plugin</text>

  <rect x="410" y="612" width="140" height="30" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="632" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">RTSP Plugin</text>

  <rect x="575" y="612" width="140" height="30" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="645" y="632" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">ONVIF Plugin</text>

  <!-- Arrow plugin runtime -> FFmpeg -->
  <line x1="480" y1="650" x2="480" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="700" width="300" height="70" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="480" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">FFmpeg</text>
  <text x="480" y="747" text-anchor="middle" font-size="11" fill="#6b21a8">RTSP → HLS transcoding</text>

  <!-- Arrow FFmpeg -> browser video (loop back) -->
  <path d="M630,735 C 820,735 820,110 682,108" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="850" y="420" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(90 850 420)">HLS stream → browser video player</text>

  <!-- Legend -->
  <rect x="40" y="800" width="16" height="16" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="64" y="813" font-size="12" fill="#334155">Client layer</text>

  <rect x="180" y="800" width="16" height="16" fill="#eef2ff" stroke="#4338ca"/>
  <text x="204" y="813" font-size="12" fill="#334155">Application layer (NestJS)</text>

  <rect x="400" y="800" width="16" height="16" fill="#fef3c7" stroke="#b45309"/>
  <text x="424" y="813" font-size="12" fill="#334155">Persistence</text>

  <rect x="540" y="800" width="16" height="16" fill="#dcfce7" stroke="#15803d"/>
  <text x="564" y="813" font-size="12" fill="#334155">Plugin layer</text>

  <rect x="680" y="800" width="16" height="16" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="704" y="813" font-size="12" fill="#334155">Media processing</text>

  <text x="480" y="860" text-anchor="middle" font-size="11" fill="#94a3b8">Core backend depends only on the CameraPlugin interface — never on Mock/RTSP/ONVIF concretely.</text>
</svg>
